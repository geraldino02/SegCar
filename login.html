<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SegCar - Login e Registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070a13;
      --bg-card: rgba(16, 23, 42, 0.7);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --grad-primary: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient glow elements */
    .glow-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(6, 182, 212, 0.03) 50%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 460px;
      z-index: 10;
      transition: max-width 0.4s ease;
    }

    .container.register-mode {
      max-width: 580px;
    }

    /* Logo Styling */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      text-align: center;
    }

    .logo-svg {
      width: 64px;
      height: 64px;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.5));
    }

    .logo-text {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .logo-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Box Card styling */
    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #fff;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.2);
    }

    .btn {
      width: 100%;
      background: var(--grad-primary);
      color: #fff;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
    }

    .switch-mode {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .switch-mode a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      margin-left: 4px;
      transition: color 0.2s ease;
    }

    .switch-mode a:hover {
      color: var(--accent-blue);
      text-decoration: underline;
    }

    /* Message Alert */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
      font-weight: 500;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      display: block;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #a7f3d0;
      display: block;
    }

    /* Validations Indicator */
    .char-limit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
      margin-top: 0.25rem;
      display: block;
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>

  <div class="container" id="authContainer">
    
    <!-- Premium SegCar Logo -->
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer circle frame -->
        <circle cx="32" cy="32" r="28" stroke="url(#paint0_linear)" stroke-width="2.5" stroke-dasharray="1 1"></circle>
        <!-- Shield background -->
        <path d="M18 20C25 20 32 15 32 15C32 15 39 20 46 20V35C46 44 32 49 32 49C32 49 18 44 18 35V20Z" fill="url(#paint1_linear)" opacity="0.15"></path>
        <path d="M18 20C25 20 32 15 32 15C32 15 39 20 46 20V35C46 44 32 49 32 49C32 49 18 44 18 35V20Z" stroke="url(#paint2_linear)" stroke-width="2" stroke-linejoin="round"></path>
        <!-- Car icon shape simplified -->
        <path d="M25 36H39M26 31.5H38C39 31.5 39.5 32 39.5 33L39 36H24.5L24 33C24 32 25 31.5 26 31.5Z" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"></path>
        <circle cx="27.5" cy="39.5" r="2.5" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"></circle>
        <circle cx="36.5" cy="39.5" r="2.5" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"></circle>
        <!-- Sat/Signal Waves -->
        <path d="M29 22C30 23 31 24 32 24C33 24 34 23 35 22" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"></path>
        <path d="M27 19C29 21 30.5 22 32 22C33.5 22 35 21 37 19" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"></path>
        <!-- Definitions of gradients -->
        <defs>
          <linearGradient id="paint0_linear" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3b82f6"></stop>
            <stop offset="1" stop-color="#06b6d4"></stop>
          </linearGradient>
          <linearGradient id="paint1_linear" x1="18" y1="15" x2="46" y2="49" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3b82f6"></stop>
            <stop offset="1" stop-color="#06b6d4"></stop>
          </linearGradient>
          <linearGradient id="paint2_linear" x1="18" y1="15" x2="46" y2="49" gradientUnits="userSpaceOnUse">
            <stop stop-color="#06b6d4"></stop>
            <stop offset="1" stop-color="#10b981"></stop>
          </linearGradient>
        </defs>
      </svg>
      <div class="logo-text">SegCar</div>
      <div class="logo-sub">Telemetria & Segurança Veicular</div>
    </div>

    <!-- Login/Register Box -->
    <div class="auth-box">
      <div class="alert" id="authAlert"></div>

      <!-- FORMULÁRIO DE LOGIN -->
      <div id="loginFormSection">
        <div class="auth-title">Acesse sua Conta</div>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-username">E-mail ou CPF</label>
            <input id="login-username" type="text" placeholder="Digite seu e-mail ou CPF" required />
          </div>
          <div class="form-group">
            <label for="login-password">Senha</label>
            <input id="login-password" type="password" placeholder="Digite sua senha" required />
          </div>
          <button type="submit" class="btn">Entrar na Plataforma</button>
        </form>

        <div class="switch-mode">
          Não tem uma conta? <a href="registro.html">Criar Conta Completa</a>
        </div>
      </div>

      <!-- FORMULÁRIO DE REGISTRO -->
      <div id="registerFormSection" style="display: none;">
        <div class="auth-title">Crie sua Conta</div>
        <form id="registerForm" onsubmit="handleRegister(event)">
          
          <div class="form-group">
            <label for="reg-name">Nome Completo</label>
            <input id="reg-name" type="text" placeholder="Nome Completo" maxlength="100" required />
            <span class="char-limit" id="limit-name">0/100 caracteres</span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg-cpf">CPF</label>
              <input id="reg-cpf" type="text" placeholder="000.000.000-00" maxlength="14" required />
            </div>
            <div class="form-group">
              <label for="reg-phone">Telefone / Celular</label>
              <input id="reg-phone" type="text" placeholder="(19) 99999-9999" maxlength="15" required />
            </div>
          </div>

          <div class="form-group">
            <label for="reg-birth">Data de Nascimento</label>
            <input id="reg-birth" type="date" required />
          </div>

          <div class="form-group">
            <label for="reg-email">E-mail</label>
            <input id="reg-email" type="email" placeholder="nome@provedor.com" required />
          </div>

          <div class="form-group">
            <label for="reg-password">Senha</label>
            <input id="reg-password" type="password" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required />
          </div>

          <button type="submit" class="btn">Cadastrar e Entrar</button>
        </form>
        <div class="switch-mode">
          Já tem uma conta? <a onclick="toggleMode(false)">Faça Login</a>
        </div>
      </div>

    </div>

  </div>

  <script>
    // URL Base da API do SegCar
    const API_URL = 'http://localhost/segcar/sketch_jul12a/api/public/index.php';

    // Máscara e validação do CPF
    const cpfInput = document.getElementById('reg-cpf');
    cpfInput.addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 11) value = value.substring(0, 11);
      
      // Aplicar máscara
      if (value.length > 9) {
        value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{1,2})$/, "$1.$2.$3-$4");
      } else if (value.length > 6) {
        value = value.replace(/^(\d{3})(\d{3})(\d{1,3})$/, "$1.$2.$3");
      } else if (value.length > 3) {
        value = value.replace(/^(\d{3})(\d{1,3})$/, "$1.$2");
      }
      e.target.value = value;
    });

    // Máscara do Telefone
    const phoneInput = document.getElementById('reg-phone');
    phoneInput.addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 11) value = value.substring(0, 11);
      
      if (value.length > 6) {
        value = value.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
      } else if (value.length > 2) {
        value = value.replace(/^(\d{2})(\d{1,5})$/, "($1) $2");
      } else if (value.length > 0) {
        value = '(' + value;
      }
      e.target.value = value;
    });

    // Caracteres restantes no Nome
    const nameInput = document.getElementById('reg-name');
    nameInput.addEventListener('input', function(e) {
      const len = e.target.value.length;
      document.getElementById('limit-name').textContent = `${len}/100 caracteres`;
    });

    // Validar CPF (Simplificado para permitir testes com números fictícios)
    function validarCPF(cpf) {
      cpf = cpf.replace(/[^\d]+/g, '');
      return cpf.length === 11;
    }

    // Alternar entre Login e Registro
    function toggleMode(registerMode) {
      const container = document.getElementById('authContainer');
      const loginSection = document.getElementById('loginFormSection');
      const registerSection = document.getElementById('registerFormSection');
      const alertBox = document.getElementById('authAlert');

      alertBox.className = 'alert';
      alertBox.style.display = 'none';

      if (registerMode) {
        container.classList.add('register-mode');
        loginSection.style.display = 'none';
        registerSection.style.display = 'block';
      } else {
        container.classList.remove('register-mode');
        loginSection.style.display = 'block';
        registerSection.style.display = 'none';
      }
    }

    // Exibir Alertas
    function showAlert(message, type) {
      const alertBox = document.getElementById('authAlert');
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
    }

    // Lidar com Login
    function handleLogin(event) {
      event.preventDefault();
      const user = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value;

      showAlert('Autenticando...', 'success');

      fetch(`${API_URL}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      })
      .then(res => {
        if (!res.ok) {
          return res.json().then(err => { throw new Error(err.message || 'Dados inválidos') });
        }
        return res.json();
      })
      .then(data => {
        if (data.status === 'ok') {
          // Salva os dados na sessão local do navegador
          const isAdmin = data.client.is_admin === 1 || data.client.role === 'admin';

          localStorage.setItem('segcar_client_id', data.client.id);
          localStorage.setItem('segcar_client_name', data.client.name);
          localStorage.setItem('segcar_vehicle_model', data.client.vehicle_model || 'Meu Veículo');
          localStorage.setItem('segcar_vehicle_plate', data.client.plate || 'n/d');
          localStorage.setItem('segcar_client_phone', data.client.phone || '');
          localStorage.setItem('segcar_device', data.client.device_id || 'veiculo_001');
          localStorage.setItem('segcar_is_admin', isAdmin ? 'true' : 'false');

          if (isAdmin) {
            showAlert('Bem-vindo, Administrador! Abrindo plataforma...', 'success');
          } else {
            showAlert('Acesso autorizado! Abrindo Dashboard...', 'success');
          }
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        }
      })
      .catch(err => {
        showAlert(err.message, 'error');
      });
    }

    // Lidar com Registro
    function handleRegister(event) {
      event.preventDefault();
      
      const name = document.getElementById('reg-name').value.trim();
      const cpf = document.getElementById('reg-cpf').value.trim();
      const birth = document.getElementById('reg-birth').value;
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      // Validação de CPF
      if (!validarCPF(cpf)) {
        showAlert('CPF informado é inválido.', 'error');
        return;
      }

      // Calcular Idade
      const birthDate = new Date(birth);
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      const m = today.getMonth() - birthDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }

      // Validação de Idade Mínima (18+)
      if (age < 18) {
        showAlert('Você deve ter pelo menos 18 anos para se cadastrar.', 'error');
        return;
      }
      if (age > 120) {
        showAlert('A data de nascimento informada é inválida.', 'error');
        return;
      }

      showAlert('Criando sua conta...', 'success');

      fetch(`${API_URL}/api/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          cpf: cpf,
          birth_date: birth,
          age: age,
          phone: phone,
          email: email,
          password: password
        })
      })
      .then(res => {
        if (!res.ok) {
          return res.json().then(err => { throw new Error(err.message || 'Erro ao registrar.') });
        }
        return res.json();
      })
      .then(data => {
        if (data.status === 'ok') {
          showAlert('Cadastro realizado com sucesso! Fazendo login...', 'success');
          
          localStorage.setItem('segcar_client_id', data.client.id);
          localStorage.setItem('segcar_client_name', data.client.name);
          localStorage.setItem('segcar_vehicle_model', 'Meu Veículo');
          localStorage.setItem('segcar_vehicle_plate', 'ABC-1234');
          localStorage.setItem('segcar_client_phone', data.client.phone);
          localStorage.setItem('segcar_device', data.client.device_id);
          localStorage.setItem('segcar_is_admin', 'false');

          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        }
      })
      .catch(err => {
        showAlert(err.message, 'error');
      });
    }
  </script>
</body>
</html>
